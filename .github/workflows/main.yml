name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev

      - name: Install buildozer and cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK (log saved regardless of outcome)
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee /tmp/build_full_log.txt
          exit ${PIPESTATUS[0]}
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Always upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: /tmp/build_full_log.txt

      - name: Upload APK if it was produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilotvision-mobile-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Fail the job if the build actually failed
        if: always()
        run: |
          if grep -q "BUILD FAILED\|Error:" /tmp/build_full_log.txt 2>/dev/null; then
            echo "Build failed — see the full-build-log artifact for details."
            grep -n "Error\|error:" /tmp/build_full_log.txt | tail -30
            exit 1
          fi
